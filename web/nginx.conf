# Nginx del Diario personal:
#   /          -> archivos de React compilados (SPA)
#   /api/...   -> reenvía (proxy) al contenedor "api" en el puerto 3000
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;   # no revelar la versión de Nginx
    client_max_body_size 1m;

    # DNS interno de Docker. Resolver "api" en cada petición (y no solo al arrancar)
    # permite que Nginx inicie aunque la API esté caída: responderá 502 en vez de no arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Logs a la salida estándar -> se ven con `docker logs diario-web`
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- API ----------
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # ---------- Archivos con hash (Vite): caché larga ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------- SPA: cualquier otra ruta devuelve index.html ----------
    # (así /entradas/5 funciona al recargar la página: React Router decide qué mostrar)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
